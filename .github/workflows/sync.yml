name: Sync AppFolio listings

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # "Run workflow" button for an immediate refresh
  push:                       # also run when the sync code itself changes
    branches: [main]
    paths: ["sync/**", ".github/workflows/sync.yml"]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read AppFolio and rebuild listings.json
        run: python sync/build.py
      - name: Save changes
        run: |
          git config user.name "gpm-listings-bot"
          git config user.email "gpm-listings-bot@users.noreply.github.com"
          git add docs/listings.json
          if ! git diff --cached --quiet; then
            git commit -m "Update listings from AppFolio"
            git push
          elif [ "$(( $(date +%s) - $(git log -1 --format=%ct) ))" -gt 1209600 ]; then
            # Keep the schedule alive: GitHub pauses schedules in repos with no commits for 60 days.
            git commit --allow-empty -m "Heartbeat: listings unchanged"
            git push
          fi
